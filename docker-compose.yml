services:
  api:
    build: ./api
    container_name: dailyniche-api
    restart: unless-stopped
    ports:
      - '8080:8080'
    environment:
      DB_PATH: /data/dailyniche.db
      PORT: '8080'
    volumes:
      - dailyniche-data:/data

  web:
    build: ./web
    container_name: dailyniche-web
    restart: unless-stopped
    depends_on:
      - api
    ports:
      - '3000:3000'
    environment:
      # "api" resolves via Compose's own automatic network + service-name
      # DNS - no manual network/container-name wrangling needed, unlike the
      # standalone `docker run` testing we did earlier tonight.
      API_URL: http://api:8080
      PORT: '3000'

volumes:
  dailyniche-data:
